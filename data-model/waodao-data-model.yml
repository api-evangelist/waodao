method: derived
source: >-
  Derived from openapi/waodao-agent-api-openapi.json (OpenAPI 3.1.0, 10 components.schemas) —
  schema $ref links plus the identifier/traversal fields (day, prev_day/next_day, metadata_url,
  contract + token_id, pool_identifier) — and cross-checked against live responses captured in
  examples/ and the self-describing field guide at GET /api/v1/waodao/schema.
docs: https://waodao.ai/api/v1/waodao/schema
notation: >-
  Relationships use has_one / has_many / belongs_to with the reference field in `via`; direction is
  from the entity that owns the reference field. The primary key of the whole dataset is the
  integer ArtChain `day`, which is also the ERC-721 token id.
identifiers:
  primary_key:
    name: day
    type: integer
    note: >-
      The ArtChain day number is the collection's canonical id and equals the Ethereum NFT
      `market.token_id`. Day 1 = 2023-02-14. `links.prev` is null on day 1; `links.next` is null on
      the newest published day.
  payload_schema_ids:
    - {id: 'waodao-agent-api@1', on: SchemaResponse}
    - {id: 'waodao-token@1', on: TokenResponse}
    - {id: 'waodao-artchain@1', on: 'TokenResponse.waodao'}
entities:
  - name: ArtChainIndex
    schema: IndexResponse
    domain: collection
    operation: listArtChainDays
    description: >-
      Snapshot of the whole ArtChain — project/schema headers, agent_context, collection counters
      (first_day, latest_day, total_days, count), traversal guidance, and the items[] array.
  - name: IndexItem
    schema: IndexItem
    domain: collection
    description: >-
      Compact per-day row inside the index: day/date/timestamp, name, metadata_url (the token API
      URL), external_url (scan page), marketplace_url, sale_status/sale_type/winner_bid_eth,
      image, real_artwork, bonus_tokens, prev_day/next_day, and the day's cultural traits
      (region, main_color, main_color_name, twitter_trend, trending_crypto, trending_nft,
      new_coin) plus secret_hash.
  - name: ArtChainDay
    schema: TokenResponse
    domain: token
    operations: [getArtChainDay, getLatestArtChainDay]
    description: >-
      Full record for one published day: OpenSea-compatible NFT metadata (name, description,
      image ipfs:// URI, external_url, attributes) plus the WAODAO extension blocks
      (waodao, market, news, trends, source) and a links block.
  - name: Attribute
    schema: Attribute
    domain: token
    description: NFT trait (trait_type/value, optional display_type such as date or boost_number).
  - name: NewsItem
    schema: NewsItem
    domain: signals
    description: One regional news signal (region, key, text, url) that fed the day's generation.
  - name: PoolRegistry
    schema: PoolsResponse
    domain: liquidity
    operation: listWaoLiquidityPools
    description: >-
      WAO token deployment + liquidity route registry — purpose, docs_url, summary, market_entry,
      wao_token (the ERC-20 / SPL deployments), data_policy, and items[].
  - name: PoolItem
    schema: PoolItem
    domain: liquidity
    description: >-
      One registered pool: pair, type, category, chain, dex, protocol, pool_identifier,
      optional pool_contract, pool_url, description, status.
  - name: AgentApiSchema
    schema: SchemaResponse
    domain: meta
    operation: getAgentApiSchema
    description: Self-describing field guide — schema id, endpoints map, agent_context, and per-field descriptions.
  - name: AgentContext
    schema: AgentContext
    domain: meta
    description: summary / why_it_matters / use_cases / economic_note block embedded in the index and schema responses.
  - name: Error
    schema: ErrorResponse
    domain: meta
    description: 'Flat error envelope { error, code }. See errors/waodao-problem-types.yml.'
relationships:
  - {from: ArtChainIndex, to: AgentContext, type: has_one, via: agent_context}
  - {from: ArtChainIndex, to: IndexItem, type: has_many, via: items}
