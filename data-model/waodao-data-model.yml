  - {from: IndexItem, to: IndexItem, type: has_one, via: prev_day, note: previous published day, null on day 1}
  - {from: IndexItem, to: IndexItem, type: has_one, via: next_day, note: next published day, null on the newest day}
  - {from: ArtChainDay, to: Attribute, type: has_many, via: attributes}
  - {from: ArtChainDay, to: NewsItem, type: has_many, via: news}
  - {from: ArtChainDay, to: ArtChainDay, type: has_one, via: 'links.prev'}
  - {from: ArtChainDay, to: ArtChainDay, type: has_one, via: 'links.next'}
  - {from: ArtChainDay, to: ArtChainIndex, type: belongs_to, via: 'links.index'}
  - {from: ArtChainDay, to: PoolRegistry, type: has_one, via: 'links.pools', note: cross-domain convenience link, not ownership}
  - {from: PoolRegistry, to: PoolItem, type: has_many, via: items}
  - {from: AgentApiSchema, to: AgentContext, type: has_one, via: agent_context}
onchain_bindings:
