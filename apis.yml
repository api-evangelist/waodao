name: WAODAO
description: >-
  WAODAO is a daily Human + AI "ArtChain": since 14 February 2023 one AI-generated NFT has been minted every day from
  world news signals, digital trends, human input and AI art, producing an on-chain cultural archive that stood at
  1,272 published days when the index was read on 2026-08-09. The WAODAO Agent API is a public, read-only JSON API — five GET operations, no account, no API key, no
  authentication, CORS enabled — for traversing that ArtChain day by day and for discovering the official WAO token
  deployments (Ethereum ERC-20 and a Wormhole-bridged Solana SPL token) and the registered DEX liquidity pools across
  Uniswap, Balancer and Meteora. The project publishes an unusually complete machine-readable discovery surface for its
  size: OpenAPI 3.1 and a 3.0.2 compatibility contract, an APIs.json index at both /apis.json and the /.well-known
  alias, an RFC 9727 API catalog advertised on every response via a Link header, a Postman collection, and llms.txt on
  both the site and the GitBook docs.
